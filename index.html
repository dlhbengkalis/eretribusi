<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b5c">
<style>
:root{
  --p:#0a47e6; --p2:#1f63ff; --pl:#e4edff; --bg:#eef4ff; --navy:#0b1b5c; --card:#fff; --tx:#0f1d44; --mu:#5a6a8c;
  --bd:#d6e0f3; --danger:#c0392b; --warn:#b9770e; --info:#1f6fb2; --r:12px;
}
*{box-sizing:border-box}
html{overflow-x:hidden;max-width:100%}
img,video,canvas{max-width:100%}
.grid>*,.filters>*,.row>*{min-width:0}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0 0 8px;line-height:1.25}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
a{color:var(--info)}
small,.muted{color:var(--mu)}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.mt{margin-top:12px}.mb{margin-bottom:12px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,#e8f0ff,#c7d9fb 55%,#9dbcf5)}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.logo{width:56px;height:56px;border-radius:16px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px}
.seg{display:flex;background:#e9eefa;border-radius:10px;padding:3px;margin:14px 0}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-weight:600;color:var(--mu);cursor:pointer}
.seg button.on{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* form */
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #9db9ff;border-color:var(--p2)}
input[readonly]{background:#f0f4fc}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.grid .full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--p);border-color:var(--p);color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn-block{width:100%}
.btn-lg{padding:16px;font-size:17px;border-radius:14px}

/* layout */
.topbar{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar b{font-size:16px}
.topbar .btn{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}
.container{max-width:1180px;margin:0 auto;padding:14px}
.tenaga .container{max-width:560px;padding-bottom:120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{color:var(--p)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1;border:0;background:transparent;padding:9px 4px 8px;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}
.bottomnav button span{display:block;font-size:20px}
.bottomnav button.on{color:var(--p);font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);padding:6px 10px;position:sticky;top:46px;z-index:15}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--mu);white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--pl);color:var(--p)}

/* beranda tenaga */
.hero{background:linear-gradient(150deg,#0a2a9e,#0a47e6);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.hero .clock{font-size:38px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.hero small{color:#c9d8ff}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat .box{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat .box b{display:block;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;color:var(--p)}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--danger)}

/* badge */
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#e9eefa;color:var(--mu);white-space:nowrap}
.b-ok{background:#d9f2e3;color:#116a3b}.b-warn{background:#fdebc8;color:#8a5a00}
.b-info{background:#dbeaf8;color:#1b5a94}.b-bad{background:#f9d9d5;color:#a52a1d}.b-purple{background:#e9defa;color:#5b3a99}

/* tabel */
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid #e8eefa;text-align:left;vertical-align:top}
th{background:#e4edfb;position:sticky;top:0;white-space:nowrap;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mu)}
tr:hover td{background:#f6f9ff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px;align-items:end}
.filters label{margin:0 0 3px}

/* riwayat */
.item{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.flag{color:var(--warn);font-size:12.5px;margin-top:4px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.modal.wide{max-width:860px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.modal .mh h2{margin:0}
.modal .x{border:0;background:#e9eefa;border-radius:99px;width:32px;height:32px;font-size:16px;cursor:pointer}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.photo{width:100%;border-radius:10px;border:1px solid var(--bd);background:#e9eefa;min-height:120px;object-fit:cover;display:block}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{aspect-ratio:4/3;border:2px dashed #b3c4e6;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mu);cursor:pointer;overflow:hidden;position:relative;background:#f6f9ff}
.slot img{width:100%;height:100%;object-fit:cover}
.gps{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:#e9eefa;margin:10px 0;font-size:13.5px}
.gps.ok{background:#d9f2e3}.gps.bad{background:#f9d9d5}.gps.wait{background:#fdebc8}

/* misc */
#toasts{position:fixed;top:12px;left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:#0f1d44;color:#fff;padding:10px 16px;border-radius:10px;max-width:480px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--danger)}.toast.ok{background:var(--p)}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:600}
.spin{width:38px;height:38px;border:4px solid #c9d8f6;border-top-color:var(--p);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;font-size:11px;color:var(--mu)}
.bars i{display:block;width:70%;background:var(--p2);border-radius:5px 5px 0 0;min-height:2px}
.bars i.o{background:#8fb0ee}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.warnbox{background:#fff5df;border:1px solid #f1d58d;color:#7a5200;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0}

/* lokasi kerja */
.lokrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
@media(max-width:640px){
  .lokrow{grid-template-columns:1fr 1fr}
  .lokrow>:first-child{grid-column:1/-1}
  .container{padding:10px}
  .hero .clock{font-size:34px}
  .modal{padding:14px}
  .grid{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}
  th,td{padding:7px 8px}
}

/* ikon & tabel admin (lebar penuh, tanpa gulir) */
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.btn-ico{padding:6px 8px}
.rowact{display:inline-flex;gap:4px}
@media(min-width:900px){
  .admin .container{max-width:none;padding:12px 18px}
  .admin .tablewrap{overflow:visible}
  .admin table{font-size:12.5px}
  .admin th{position:static;white-space:normal}
  .admin th,.admin td{padding:7px 8px;overflow-wrap:anywhere}
}

/* cetak */
#printArea{display:none}
#printArea h2{text-align:center;margin:0}
#printArea .kop{text-align:center;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:12px}
#printArea table{font-size:11px}
#printArea th{position:static;background:#eee;color:#000}
#printArea th,#printArea td{border:1px solid #444}
#printArea .ttd{margin-top:28px;display:flex;justify-content:flex-end}
#printArea .ttd div{width:260px;text-align:center}
@media print{
  body{background:#fff}
  #app,#toasts,#loading,.modal-bg{display:none!important}
  #printArea{display:block}
  @page{size:A4 landscape;margin:12mm}
}

/* ===== TEMA BIRU, SKALA KOMPAK (v9) ===== */
html,body{font-size:13px;line-height:1.4}
h1{font-size:19px}h2{font-size:17px}h3{font-size:13.5px}
label{font-size:12px;margin:8px 0 3px}
input,select,textarea{padding:8px 10px;font-size:16px;border-radius:9px}
.btn{padding:8px 13px;font-size:13px;border-radius:9px}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:8px}
.card{padding:12px;border-radius:12px;box-shadow:0 1px 2px rgba(15,29,68,.04)}
.card h3{color:var(--navy)}
.logo{background:none;width:auto;height:auto;margin-bottom:8px;border-radius:0;display:block}
.logo svg,.brand svg{width:34px;height:34px;display:block}
.login-card{max-width:340px;padding:22px 20px;border-radius:16px}
.login-card h1{display:inline-block;vertical-align:middle;margin:0 0 0 8px;color:var(--navy)}
.logo{display:inline-block;vertical-align:middle;margin:0}
.seg{background:#eceff4;margin:12px 0}
.seg button{padding:7px;font-size:13px}
.seg button.on{background:#dbe7ff;color:var(--p);box-shadow:none}
.infobox{display:flex;gap:8px;align-items:flex-start;background:#e9f0ff;color:var(--navy);border-radius:10px;padding:9px 11px;font-size:12px;margin-top:12px}
.infobox i{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--p);color:var(--p);font:700 10px/13px system-ui;text-align:center;font-style:normal}
.btn-primary{background:var(--p);border-color:var(--p)}
.topbar{background:#3f5fb8;padding:8px 12px}
.tenaga .topbar b{font-size:14px}
.badge{font-size:11px;padding:2px 8px}
.kpi{border-radius:12px;padding:11px 12px}
.kpi b{font-size:22px;color:var(--p)}
.kpi.warn b{color:var(--p)}.kpi.bad b{color:var(--danger)}

/* tabel */
.tablewrap{border-radius:12px}
table{font-size:12.5px}
th{text-transform:none;letter-spacing:0;font-size:12px;color:var(--navy);font-weight:700}
th,td{padding:7px 9px}
tr:hover td{background:#f6f9ff}

/* ===== kerangka admin ===== */
.admin .sb{background:#c5d3f0;color:var(--navy);border-right:1px solid #aebfe4}
.admin .sb .brand{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:800;font-size:15px}
.admin .sb .brand svg{width:26px;height:26px}
.admin .tabs{display:flex;gap:3px;overflow-x:auto;background:transparent;border:0;padding:4px 8px;position:static}
.admin .tabs button,.admin .sb-out{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:#2b3d6e;padding:8px 11px;border-radius:9px;font:inherit;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;text-align:left}
.admin .tabs button.on{background:#fff;color:#0a47e6;font-weight:700;box-shadow:0 1px 3px rgba(15,29,68,.12)}
.admin .tabs button:hover:not(.on),.admin .sb-out:hover{background:#d6e1f6}
.admin .tabs svg,.admin .sb-out svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.admin .sb-out{margin:4px 8px 8px}
.admin .main{min-width:0}
.admin .hdr{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--bd);padding:8px 16px;position:sticky;top:0;z-index:18}
.admin .hdr b{font-size:13.5px;color:var(--navy)}
.admin .hdr small{color:var(--mu);font-size:12px}
.admin .hdr .sep{width:1px;height:16px;background:var(--bd)}
.admin .hdr button{width:30px;height:30px;border:0;border-radius:8px;background:#e4edff;color:var(--p);cursor:pointer;display:flex;align-items:center;justify-content:center}
.admin .hdr button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.admin .container h2{font-size:20px;font-weight:800;color:var(--navy);margin:0 0 10px}
@media(min-width:900px){
  .admin{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}
  .admin .sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .admin .tabs{flex-direction:column;overflow:visible;flex:1;padding:6px 10px}
  .admin .sb-out{margin:4px 10px 12px}
  .admin .container{padding:14px 18px}
}
@media(max-width:899px){
  .admin .sb{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center}
  .admin .sb .brand{flex:1}
  .admin .sb-out{margin:0 8px}
  .admin .tabs{width:100%;order:3;padding:2px 8px 8px}
  .admin .hdr{position:static;padding:6px 12px}
}

/* dashboard */
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dhead h2{margin:0!important}
.datechip{display:inline-flex;align-items:center;gap:6px;background:#dfe9ff;color:var(--navy);padding:5px 11px;border-radius:9px;font-weight:700;font-size:12.5px}
.datechip svg,.kico svg,.hico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dgrid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:899px){.dgrid{grid-template-columns:1fr}}
.hero2{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#3150a8,#4d78d6);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:12px}
.hero2 .hico{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.hero2 small{color:#d4e0ff;font-size:13px;font-weight:600}
.hero2 b{display:block;font-size:38px;line-height:1.05;margin-top:2px}
.dgrid h3{font-size:14px;margin:4px 0 8px;color:var(--navy)}
.dgrid .cards{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:0}
.kpi.ico{display:flex;gap:10px;align-items:center}
.kico{flex:none;width:30px;height:30px;border-radius:8px;background:#e4edff;color:var(--p);display:flex;align-items:center;justify-content:center}
.kpi.ico small{display:block;color:var(--tx);font-size:12.5px;font-weight:600}
.kpi.ico b{font-size:24px;line-height:1.1}
.review .rv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e8eefa}
.review .rv:last-child{border:0}
.review .rv span.t{flex:1;font-size:12.5px;font-weight:600;color:var(--tx)}
.review .rv b{font-size:20px;color:var(--p)}
.review .kico{background:#fff2d9;color:#c47a00}
.review h3{display:flex;align-items:center;gap:7px}
.review h3 svg{width:17px;height:17px;fill:none;stroke:#e6a100;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){input,select,textarea{font-size:13px;padding:7px 10px}.filters{gap:8px 10px}}

.admin .hdr #sbt{background:transparent;color:var(--navy)}
.admin .hdr #sbt:hover{background:#e4edff}
.admin .hdr #lo2{display:none!important}
@media(min-width:900px){
  .admin{transition:grid-template-columns .18s ease}
  .admin.sb-hide{grid-template-columns:58px minmax(0,1fr)}
  .admin.sb-hide .brand span,.admin.sb-hide .tabs button span,.admin.sb-hide .sb-out span{display:none}
  .admin.sb-hide .brand{justify-content:center;padding:12px 0}
  .admin.sb-hide .tabs{padding:6px 7px}
  .admin.sb-hide .tabs button,.admin.sb-hide .sb-out{justify-content:center;padding:10px 0}
  .admin.sb-hide .sb-out{margin:4px 7px 12px}
}
@media(max-width:899px){.admin .hdr #sbt{display:none}}

/* ===== TENAGA: tampilan HP ===== */
.tenaga{background:var(--bg);min-height:100vh}
.tenaga .topbar{background:#3f5fb8;padding:11px 16px;gap:10px;flex-wrap:nowrap}
.tenaga .tlogo svg{width:28px;height:28px;display:block}
.tenaga .topbar b{font-size:17px;font-weight:800}
.tenaga .tname{color:#d9e4ff;font-size:12px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tenaga .container{max-width:480px;padding:14px 14px 96px}
.tenaga h2{font-size:24px;font-weight:800;color:var(--navy);margin:0}
.tenaga input,.tenaga select,.tenaga textarea{font-size:16px;padding:12px 14px;border-radius:13px}
.tenaga .btn{padding:12px 16px;font-size:15px;border-radius:13px}
.tenaga .btn-lg{padding:17px;font-size:18px;border-radius:16px;gap:10px}
.tenaga .btn-lg svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tenaga .btn-primary{box-shadow:0 6px 14px rgba(10,71,230,.22)}
.tenaga .card{border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(15,29,68,.05);margin-bottom:12px}
.tenaga .card h3{font-size:19px;font-weight:800;margin:0 0 2px}

/* beranda */
.tenaga .hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#3150a8,#4d78d6);border-radius:22px;padding:20px 22px;margin-bottom:12px;box-shadow:0 8px 20px rgba(49,80,168,.25)}


.tenaga .hero small{display:block;color:#e2ebff;font-size:14px;position:relative;z-index:1}
.tenaga .hero small:first-child{font-size:15px;font-weight:600}
.tenaga .hero .clock{font-size:46px;margin:4px 0 6px;position:relative;z-index:1}
.tenaga .idcard b{font-size:19px;color:var(--navy)}
.tenaga .idcard small{font-size:14px}
.tenaga .badge{font-size:13px;padding:5px 12px}
.tenaga .stat{gap:12px;margin-bottom:14px}
.tenaga .stat .box{border-radius:16px;padding:14px 16px}
.tenaga .stat .box small{font-size:14px;color:var(--mu)}
.tenaga .stat .box b{font-size:26px;letter-spacing:2px;margin-top:6px;color:var(--navy)}
.tenaga .izsk{gap:12px;flex-wrap:nowrap}
.tenaga .izsk .btn{flex:1;background:#fff;border:2px solid var(--p);color:var(--p);font-size:18px;font-weight:800;border-radius:16px;padding:15px}

/* judul halaman */
.ptitle{margin:8px 2px 14px}
.ptitle small{display:block;color:var(--mu);font-size:16px;margin-top:2px}
.tenaga #bl{margin-bottom:14px;border-radius:14px}
.tenaga .item{border-radius:16px;padding:14px}

/* keadaan kosong */
.emptycard,.emptyin{text-align:center}
.emptycard{padding:26px 18px 18px!important}
.emptycard>svg,.emptyin>svg{width:78px;height:78px;fill:none;stroke:#9db9f5;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin:8px auto 0;display:block}
.emptycard p,.emptyin p{color:var(--tx);font-size:17px;margin:12px 0 18px}
.emptyin{padding:8px 0 0}
.emptyin p{margin-bottom:6px}

/* akun */
.tenaga .kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #dfe8f8;font-size:15px}
.tenaga .kv small{color:var(--mu);font-size:15px}
.tenaga .kv b{text-align:right;color:var(--navy)}
.tenaga .pw{position:relative}
.tenaga .pw input{padding-right:48px}
.tenaga .pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:38px;height:38px;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tenaga .pw .eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tenaga label{font-size:14px;font-weight:700;margin:12px 0 6px;color:var(--navy)}

/* navigasi bawah */
.bottomnav{background:#fff;border-top:1px solid #dfe7f5;box-shadow:0 -4px 16px rgba(15,29,68,.06);padding-bottom:max(env(safe-area-inset-bottom),6px)}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 6px;font-size:13px;color:#4a5b82;font-weight:500}
.bottomnav button span{font-size:0;line-height:0;display:block}
.bottomnav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottomnav button.on{color:var(--p);font-weight:800}

/* modal (bottom sheet) */
.modal{border-radius:26px 26px 0 0;padding:18px 18px 22px}
.modal .mh h2{font-size:23px;font-weight:800;color:var(--navy)}
.modal .x{width:38px;height:38px;background:#fff;border:1.5px solid var(--navy);color:var(--navy);font-size:17px}
.gps{border-radius:14px;padding:12px 14px;font-size:14px}
.gps.bad{background:#fbdcd9;color:#6e1f17}
.slot{border:2px dashed var(--p2);background:#e8f3ff;border-radius:18px;color:var(--navy);font-size:15px;flex-direction:column;gap:6px;line-height:1.3}
.slot>svg{width:46px;height:46px;fill:none;stroke:var(--p);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.slot b{font-size:18px}
.slot small{color:var(--navy);font-size:15px}
.photos{gap:10px}

.tenaga .tname{display:none}
@media(max-width:700px){
  .modal input,.modal select,.modal textarea{font-size:16px;padding:12px 14px;border-radius:13px}
  .modal label{font-size:14px;font-weight:700;margin:12px 0 6px;color:var(--navy)}
  .modal .btn{padding:13px 16px;font-size:15px;border-radius:13px}
  .modal .btn-lg{padding:17px;font-size:18px;border-radius:16px}
  .modal .photos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .modal .photos .slot{aspect-ratio:1/1.05;font-size:14px;flex-direction:column}
  .modal .grid{grid-template-columns:1.3fr 1fr;gap:0 12px}
}
#slot.slot{aspect-ratio:auto!important;width:100%;height:min(46vh,360px);max-height:none!important}
.tenaga .card>small{font-size:14px}

/* ===== TENAGA: skala HP diperkecil (v9b) ===== */
html{-webkit-text-size-adjust:100%}
.tenaga,.tenaga *{min-width:0}
.tenaga{overflow-x:hidden}
.tenaga .topbar{padding:8px 12px}
.tenaga .tlogo svg{width:24px;height:24px}
.tenaga .topbar b{font-size:15px}
.tenaga .container{padding:10px 10px 78px}
.tenaga h2{font-size:19px}
.tenaga input,.tenaga select,.tenaga textarea{font-size:16px;padding:9px 11px;border-radius:11px}
.tenaga .btn{padding:9px 12px;font-size:13.5px;border-radius:11px}
.tenaga .btn-lg{padding:13px;font-size:15.5px;border-radius:13px;gap:8px}
.tenaga .btn-lg svg{width:21px;height:21px}
.tenaga .card{padding:12px;border-radius:14px;margin-bottom:10px}
.tenaga .card h3{font-size:15.5px}
.tenaga .hero{padding:14px 16px;border-radius:18px;margin-bottom:10px}
.tenaga .hero small{font-size:12px}
.tenaga .hero small:first-child{font-size:13px}
.tenaga .hero .clock{font-size:34px;margin:2px 0 4px;letter-spacing:.5px}
.tenaga .idcard b{font-size:15.5px;overflow-wrap:anywhere}
.tenaga .idcard small{font-size:12px}
.tenaga .badge{font-size:11.5px;padding:3px 10px}
.tenaga .stat{gap:10px;margin-bottom:10px}
.tenaga .stat .box{padding:10px 12px;border-radius:13px}
.tenaga .stat .box small{font-size:12px}
.tenaga .stat .box b{font-size:21px;margin-top:3px}
.tenaga .izsk{gap:10px}
.tenaga .izsk .btn{font-size:15px;padding:11px;border-radius:13px}
.ptitle{margin:4px 2px 10px}
.ptitle small{font-size:13px}
.tenaga #bl{margin-bottom:10px;border-radius:11px}
.tenaga .item{padding:11px;border-radius:13px;font-size:13px}
.emptycard{padding:18px 14px 14px!important}
.emptycard>svg,.emptyin>svg{width:52px;height:52px;margin-top:4px}
.emptycard p,.emptyin p{font-size:14px;margin:8px 0 12px}
.tenaga .kv{padding:8px 0;font-size:13px;gap:10px}
.tenaga .kv small{font-size:13px}
.tenaga .kv b{overflow-wrap:anywhere}
.tenaga label{font-size:12.5px;margin:9px 0 4px}
.tenaga .pw .eye{width:34px;height:34px}
.tenaga .pw .eye svg{width:19px;height:19px}
.tenaga .pw input{padding-right:42px}
.tenaga .card>small{font-size:12px}
.bottomnav button{padding:7px 2px 4px;font-size:11.5px;gap:2px}
.bottomnav button svg{width:22px;height:22px}
@media(max-width:700px){
  .modal{padding:14px 14px 16px;max-height:92vh;border-radius:20px 20px 0 0}

  .modal .x{width:32px;height:32px;font-size:14px}
  .modal input,.modal select,.modal textarea{font-size:16px;padding:9px 11px;border-radius:11px}
  .modal textarea{min-height:76px}
  .modal label{font-size:12.5px;margin:9px 0 4px}
  .modal .btn{padding:10px 14px;font-size:14px}

.slot>svg{width:34px;height:34px}
.slot b{font-size:15px}
.slot small{font-size:12.5px}
.modal .muted{font-size:12px}

/* ===== v9c: pengaman lebar + skala lebih kecil ===== */

/* ===== v13: TAMPILAN TENAGA BARU ===== */
:root{--t-ink:#0c1f4d;--t-mu:#64748b;--t-bg:#f1f5fb;--t-line:#e3eaf6;--t-teal:#0e9aa7;--t-green:#16a36a;--t-amber:#e8890c;--t-rose:#e0425a;--t-blue:#1d4ed8}
#app.tenaga{background:var(--t-bg);font-size:13.5px;max-width:480px;margin:0 auto;min-height:100vh;position:relative;box-shadow:0 0 0 1px rgba(12,31,77,.04)}
body{background:#dfe7f5}
#app.tenaga .container{max-width:none;padding:0 0 110px;width:100%}
.t2-head{position:relative;background:linear-gradient(155deg,#0a2466 0%,#1647c8 58%,#0e8ea6 130%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 62px;border-radius:0 0 30px 30px;overflow:hidden}
.t2-head:before{content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 68%)}
.t2-head:after{content:"";position:absolute;left:-40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(20,214,196,.28),rgba(20,214,196,0) 70%)}
.t2-head>*{position:relative;z-index:1}
.t2-top{display:flex;align-items:center;gap:12px}
.t2-av{flex:none;width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;letter-spacing:.5px}
.t2-who{flex:1;min-width:0}
.t2-who small{display:block;color:#cfe0ff;font-size:12px}
.t2-who b{display:block;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2-logo svg{width:30px;height:30px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.t2-date{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600}
.t2-date svg,.t2-ic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.t2-ptitle h2{color:#fff!important;font-size:21px!important;font-weight:800;margin:2px 0 2px!important}
.t2-ptitle small{color:#cfe0ff;font-size:12.5px;display:block}
.t2-body{padding:0 14px}
.t2-pull{margin-top:-40px;position:relative;z-index:2}
.t2-card{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 28px rgba(12,31,77,.09),0 1px 2px rgba(12,31,77,.05)}
.t2-card h3{color:var(--t-ink);font-size:14.5px;margin:0}
.t2-sec{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.t2-sec .t2-ic{width:32px;height:32px;border-radius:11px;background:#e7efff;color:var(--t-blue);display:flex;align-items:center;justify-content:center}
.t2-sec .t2-n{margin-left:auto;background:#e7efff;color:var(--t-blue);font-weight:800;font-size:12px;border-radius:99px;padding:3px 10px}
.t2-clock{text-align:center;padding:18px 16px 16px}
.t2-clock .t2-clk{font-size:44px;line-height:1;font-weight:800;letter-spacing:1px;color:var(--t-ink);font-variant-numeric:tabular-nums}
.t2-clock .t2-sub{color:var(--t-mu);font-size:12px;margin:6px 0 10px}
.t2-chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;background:#eef2fa;color:var(--t-mu)}
.t2-chip.ok{background:#d9f4e6;color:#0d6b43}.t2-chip.warn{background:#fdeccb;color:#8a5200}.t2-chip.info{background:#dbeaff;color:#1b4fa0}.t2-chip.bad{background:#fbdcdf;color:#a3263a}
.t2-steps{display:flex;align-items:center;gap:10px;margin:16px 0 4px;text-align:left}
.t2-step{display:flex;align-items:center;gap:9px;flex:none}
.t2-step .dot{width:34px;height:34px;border-radius:12px;background:#eef2fa;color:#94a3b8;display:flex;align-items:center;justify-content:center}
.t2-step .dot svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t2-step small{display:block;color:var(--t-mu);font-size:11px}
.t2-step b{display:block;font-size:16px;color:var(--t-ink);font-variant-numeric:tabular-nums}
.t2-step.in .dot{background:#d9f4e6;color:#0d8a58}
.t2-step.out .dot{background:#fde1e5;color:#cc3049}
.t2-track{flex:1;height:6px;border-radius:9px;background:#e6ecf7;overflow:hidden}
.t2-track i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#16a36a,#0e9aa7)}
.t2-jam{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--t-line);color:var(--t-mu);font-size:12px}
.t2-jam b{color:var(--t-ink)}
.t2-jam svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t2-go{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:20px;padding:14px 16px;color:#fff;text-align:left;font:inherit;cursor:pointer;margin-bottom:10px;box-shadow:0 10px 22px rgba(14,154,167,.28)}
.t2-go.in{background:linear-gradient(120deg,#0e9a6b,#14b8a6)}
.t2-go.out{background:linear-gradient(120deg,#d9374f,#f0793c);box-shadow:0 10px 22px rgba(217,55,79,.26)}
.t2-go .gi{flex:none;width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.t2-go .gi svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t2-go b{display:block;font-size:17px}
.t2-go small{display:block;color:rgba(255,255,255,.85);font-size:12px;margin-top:1px}
.t2-go:active{transform:scale(.985)}
.t2-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.t2-soft{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--t-line);background:#fff;border-radius:16px;padding:12px;font:inherit;font-weight:700;color:var(--t-ink);cursor:pointer}
.t2-soft svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t2-soft.iz svg{color:var(--t-blue)}.t2-soft.sk svg{color:var(--t-rose)}
.t2-done{display:flex;gap:12px;align-items:center}
.t2-done .gi{flex:none;width:42px;height:42px;border-radius:14px;background:#d9f4e6;color:#0d8a58;display:flex;align-items:center;justify-content:center}
.t2-done .gi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t2-done b{display:block;color:var(--t-ink)}.t2-done small{color:var(--t-mu)}
.t2-lap{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f8}
.t2-lap:last-of-type{border-bottom:0}
.t2-lap i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--t-teal)}
.t2-lap span{flex:1;min-width:0;font-size:12.5px;color:var(--t-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2-lap em{font-style:normal;color:var(--t-mu);font-size:11.5px;font-variant-numeric:tabular-nums}
.t2-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:15px;padding:12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:#e7efff;color:var(--t-blue);margin-top:10px}
.t2-btn.pri{background:linear-gradient(120deg,#1647c8,#0e8ea6);color:#fff;box-shadow:0 8px 18px rgba(22,71,200,.25)}
.t2-btn.red{background:#fde8eb;color:#c22c43}
.t2-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t2-q{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:25;border:0;border-radius:99px;background:#fff8e1;color:#7a4b00;font:inherit;font-size:11.5px;font-weight:700;padding:6px 11px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.t2-seg{display:flex;background:#e6ecf8;border-radius:15px;padding:4px;margin-bottom:12px}
.t2-seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:12px;font:inherit;font-weight:700;font-size:13px;color:var(--t-mu);cursor:pointer}
.t2-seg button.on{background:#fff;color:var(--t-blue);box-shadow:0 2px 8px rgba(12,31,77,.1)}
.t2-month{margin-top:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:15px;padding:4px 6px 4px 12px}
.t2-month span{font-size:12px;color:#d6e4ff;font-weight:600}
.t2-month input{flex:1;background:transparent!important;border:0!important;color:#fff!important;font-size:14px!important;font-weight:700;padding:8px 4px!important;outline:0!important;min-width:0;color-scheme:dark}
.t2-day{display:flex;gap:12px;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 4px 14px rgba(12,31,77,.06);border-left:5px solid #cbd5e6}
.t2-day.s-hadir{border-left-color:#16a36a}.t2-day.s-terlambat{border-left-color:#e8890c}.t2-day.s-izin,.t2-day.s-dinas{border-left-color:#2f7de1}.t2-day.s-sakit{border-left-color:#8b5cf6}
.t2-dn{flex:none;width:48px;text-align:center;background:#f1f5fb;border-radius:13px;padding:7px 0}
.t2-dn b{display:block;font-size:20px;line-height:1;color:var(--t-ink)}
.t2-dn small{display:block;font-size:10.5px;color:var(--t-mu);text-transform:uppercase;margin-top:2px}
.t2-dm{flex:1;min-width:0}
.t2-dm .tm{display:flex;gap:14px;font-variant-numeric:tabular-nums;color:var(--t-ink);font-weight:700;font-size:14px}
.t2-dm .tm span small{display:block;color:var(--t-mu);font-weight:500;font-size:10.5px}
.t2-dm .bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.t2-dm .flag{margin-top:6px}
.t2-empty{text-align:center;color:var(--t-mu);padding:22px 10px}
.t2-empty svg{width:54px;height:54px;fill:none;stroke:#aac0ee;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 8px}
#app.tenaga .item{background:#fff;border:0;border-radius:18px;padding:13px;box-shadow:0 4px 14px rgba(12,31,77,.06);margin-bottom:10px}
.t2-prof{display:flex;align-items:center;gap:14px}

<body data-app="e-Outsourcing">
  <div id="app"></div>
  <div id="printArea"></div>
  <div id="toasts"></div>
  <div id="loading" class="hidden"><div class="spin"></div><div id="loadingMsg">Memuat…</div></div>
<script>
(function () {
'use strict';

/* ============================================================
 * Util dasar
 * ========================================================== */
var $ = function (s, r) { return (r || document).querySelector(s); };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var BLN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function tglId(s) {
  if (!s) return '';
  var p = String(s).split('-');
  return (+p[2]) + ' ' + BLN[+p[1] - 1].substr(0, 3) + ' ' + p[0];
}
function blnId(ym) { var p = ym.split('-'); return BLN[+p[1] - 1] + ' ' + p[0]; }
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

var S = { token: null, role: null, user: null, cfg: {}, opsi: {}, off: 0, tanggal: '', presensi: null, laporan: [], tenaga: null };

var clockTimer = null;

/* ============================================================
 * Komunikasi server
 * ========================================================== */

/* Cache baca (admin): pindah menu terasa instan. Data lama ditampilkan dulu, lalu diperbarui di latar
 * belakang bila sudah > 45 dtk. Cache dikosongkan setiap ada perubahan data (simpan/hapus/verifikasi dst). */
var RD = { apiAdminDashboard: 1, apiTenagaList: 1, apiPresensiList: 1, apiLaporanList: 1, apiRekap: 1, apiRekapVolume: 1, apiRingkasan: 1, apiAuditList: 1, apiPengaturanGet: 1 };
var RW = /(Simpan|Hapus|Import|ResetPin|Verif|Koreksi|Kunci|Ganti|Login|Logout|Kosongkan)/;
var RC = {}, RFRESH = {};
function apiRaw(fn, args, tried) {
  return call.apply(null, [fn, S.token].concat(args)).catch(function (e) {
    if (e.code === 'AUTH') { logout(true, e.message); }
    // pembacaan data: coba ulang otomatis sekali bila koneksi ke server gagal sesaat
    if (e.net && RD[fn] && !tried && S.token) return new Promise(function (r) { setTimeout(r, 1200); }).then(function () { return apiRaw(fn, args, true); });
    throw e;
  });
}
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (RD[fn]) {
    var key = fn + '|' + JSON.stringify(args), c = RC[key];
    if (c) {
      if (Date.now() - c.t > 45000 && !RFRESH[key]) {
        RFRESH[key] = 1;
        apiRaw(fn, args).then(function (d) {
          var j = JSON.stringify(d), changed = j !== c.j;
          RC[key] = { t: Date.now(), j: j, pg: c.pg };
          if (changed && !$('.modal-bg') && document.activeElement && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && S.role === 'admin') {
            var pg = ({ dash: aDash, ten: aTenaga, pres: aPresensi, lap: aLaporan, rekap: aRekap, set: aSetting, audit: aAudit })[aPage];
            if (pg && aPage === c.pg) pg();
          }
        }).catch(function () {}).then(function () { delete RFRESH[key]; });
      }
      return Promise.resolve(JSON.parse(c.j));
    }
    return apiRaw(fn, args).then(function (d) { RC[key] = { t: Date.now(), j: JSON.stringify(d), pg: (typeof aPage !== 'undefined' ? aPage : '') }; return d; });
  }
  return apiRaw(fn, args).then(function (d) { if (RW.test(fn)) RC = {}; if (/^api(Presensi|LaporanSimpan)$/.test(fn)) RWC = {}; return d; });
}
/* Cache riwayat tenaga (per bulan): menu Laporan/Riwayat tampil seketika dari cache, lalu disegarkan di latar belakang
 * bila data > 30 dtk. Dikosongkan setiap tenaga menyimpan presensi/laporan dan saat keluar. */
var RWC = {}, RWP = {};

  var c = RWC[ym];
  if (c) cb(JSON.parse(c.j));
  if (c && Date.now() - c.t < 30000) return Promise.resolve();
  var p = RWP[ym]; // permintaan yang sedang berjalan dipakai bersama (prefetch + klik menu tidak menggandakan panggilan)
  if (!p) {
    p = RWP[ym] = apiRaw('apiRiwayat', [ym]).then(function (d) {
      RWC[ym] = { t: Date.now(), j: JSON.stringify(d) }; delete RWP[ym]; return d;
    }, function (e) { delete RWP[ym]; throw e; });
  }
  return p.then(function (d) { if (!c || c.j !== JSON.stringify(d)) cb(d); }).catch(function (e) { if (!c) throw e; });

function busy(fn, msg) {
  loading(true, msg);
  return Promise.resolve().then(fn).then(function (r) { loading(false); return r; }, function (e) { loading(false); throw e; });
}
function loading(on, msg) {
  $('#loading').classList.toggle('hidden', !on);
  if (msg) $('#loadingMsg').textContent = msg; else $('#loadingMsg').textContent = 'Memuat…';
}
function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  $('#toasts').appendChild(t);

}
function onErr(e) { toast(e.message || String(e), 'err'); }

/* ============================================================
 * Antrean kirim ulang (offline / sinyal lemah) — khusus tenaga
 * ========================================================== */
var Q = { busy: false, timer: null, mem: [], bound: false };
var QMSG = 'Tidak ada koneksi. Data disimpan di perangkat dan akan dikirim otomatis saat sinyal kembali (presensi akan ditandai agar diperiksa admin).';
function qKey() { return 'eo_q_' + ((S.user && S.user.no_id) || ''); }
function qLoad() { try { var r = localStorage.getItem(qKey()); return r ? JSON.parse(r) : []; } catch (e) { return Q.mem.slice(); } }
function qSave(l) { Q.mem = l.slice(); try { localStorage.setItem(qKey(), JSON.stringify(l)); } catch (e) { /* tetap tersimpan di memori halaman */ } }
function qInd() {
  var b = $('#qind'); if (!b) return;
  var n = qLoad().length;
  b.classList.toggle('hidden', !n);
  b.textContent = '⏳ ' + n + ' tertunda';
}
function qAdd(fn, payload) {
  var l = qLoad();
  if (l.length >= 10) throw new Error('Antrean penuh (10 data). Hubungkan ke internet, lalu kirim ulang.');
  l.push({ fn: fn, payload: payload, at: Date.now() });
  qSave(l);
  qInd();
}
function qShift() { var l = qLoad(); l.shift(); qSave(l); }
// kirim sekarang; bila gagal karena jaringan, simpan ke antrean
function sendOrQueue(fn, payload) {
  return api(fn, payload).then(function (r) { return { done: true, r: r }; }, function (e) {
    if (!e.net) throw e;
    payload.offline = true;
    qAdd(fn, payload);
    return { done: false };
  });
}
function qFlush() {
  if (Q.busy || S.role !== 'tenaga' || !S.token || !qLoad().length) { qInd(); return Promise.resolve(); }
  Q.busy = true;
  var sent = 0, rejected = [];
  function next() {
    var l = qLoad();
    if (!l.length) return Promise.resolve();
    var it = l[0];
    return api(it.fn, it.payload).then(function () { sent++; qShift(); return next(); }, function (e) {
      if (e.net || e.code === 'AUTH' || e.code === 'MUSTCHANGE') return null; // coba lagi nanti
      rejected.push((it.fn === 'apiPresensi' ? 'Presensi ' + (it.payload.aksi || '') : 'Laporan') + ': ' + e.message);
      qShift();
      return next();
    });
  }
  return next().then(function () {
    Q.busy = false; qInd();
    if (sent) toast(sent + ' data tertunda berhasil dikirim.', 'ok');
    rejected.forEach(function (m) { toast('Ditolak server — ' + m, 'err'); });
    if (sent && S.token) return refreshToday().then(function () { if (tPage === 'home') tHome(); else if (tPage === 'lap') tLaporan(); });

}
function qStart() {
  qInd();

  if (Q.timer) clearInterval(Q.timer);
  Q.timer = setInterval(qFlush, 45000);

/* ============================================================
 * Peran admin
 * ========================================================== */
function peran() { return (S.user && S.user.peran) || 'SUPER'; }

/* ============================================================
 * Modal

    (opts.noClose ? '' : '<button class="x" type="button" aria-label="Tutup">✕</button>') + '</div><div class="mb-body">' + body + '</div></div>';

function askText(title, label, required, val) {
  return new Promise(function (res) {
    var m = openModal(title, '<label>' + esc(label) + '</label><textarea id="at">' + esc(val || '') + '</textarea><div class="row mt"><span class="spacer"></span><button class="btn" id="cn">Batal</button><button class="btn btn-primary" id="ok">Simpan</button></div>', { noClose: true });

function formVals(root) {
  var o = {};

  return o;
}

/* ============================================================
 * Waktu server (tampilan)
 * ========================================================== */
function srvDate() { return new Date(Date.now() + S.off); }
function tzOpt(o) { o.timeZone = S.cfg.zona_waktu || 'Asia/Jakarta'; return o; }
function clockStr() {
  try { return new Intl.DateTimeFormat('id-ID', tzOpt({ hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })).format(srvDate()).replace(/\./g, ':'); }

}

}
function dateIso() {
  try { return new Intl.DateTimeFormat('en-CA', tzOpt({ year: 'numeric', month: '2-digit', day: '2-digit' })).format(srvDate()); }

/* ============================================================
 * Foto & GPS
 * ========================================================== */

function zoomImg(src) { openModal('Foto', '<img class="photo" style="min-height:0" src="' + src + '">', { wide: true }); }

}

function readImage(file, maxDim) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, maxDim / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);

function stamp(canvas, lines) {

  g.fillRect(0, c.height - h, c.width, h);
  g.fillStyle = '#fff'; g.font = 'bold ' + fs + 'px sans-serif'; g.textBaseline = 'top';
  lines.forEach(function (t, i) { g.fillText(t, pad, c.height - h + pad + i * lh, c.width - pad * 2); });
  return c.toDataURL('image/jpeg', 0.72);
}
function stampTime() { return dateIso() + ' ' + clockStr() + ' ' + (S.cfg.label_zona || ''); }

function watchGps(onUpdate, onError) {
  if (!navigator.geolocation) { onError('Browser tidak mendukung GPS.'); return { stop: function () {}, best: function () { return null; } }; }
  var best = null;
  var id = navigator.geolocation.watchPosition(function (pos) {
    var c = pos.coords;
    if (!best || c.accuracy <= best.accuracy || pos.timestamp - best.ts > 20000) {
      best = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy, ts: pos.timestamp };
    }
    onUpdate(best);
  }, function (err) {
    var m = err.code === 1 ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini di pengaturan browser, lalu coba lagi.' :
      err.code === 2 ? 'Lokasi tidak tersedia. Pastikan GPS aktif.' : 'Waktu pencarian lokasi habis. Coba lagi di area terbuka.';
    onError(m);
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  return { stop: function () { navigator.geolocation.clearWatch(id); }, best: function () { return best; } };
}

function absenForm(aksi) {
  var maks = Number(S.cfg.maks_akurasi_m) || 100;
  var st = { canvas: null, ts: 0, gps: null, last: null };
  var gps;
  var m = openModal(aksi === 'MASUK' ? 'Absen Masuk' : 'Absen Pulang',
    '<div class="gps wait" id="gbox">📍 Mencari lokasi…</div>' +
    '<div class="slot" id="slot" style="aspect-ratio:3/4;max-height:52vh">' + nv('cam') + '<b>Ketuk untuk mengambil foto</b><small>Swafoto di lokasi kerja</small></div>' +
    '<input type="file" id="fi" accept="image/*" capture="user" class="hidden">' +
    '<button class="btn btn-primary btn-lg btn-block mt" id="send" disabled>Kirim presensi</button>' +
    '<p class="muted" style="font-size:12.5px;margin-bottom:0">Waktu dicatat otomatis oleh server. Foto diberi cap waktu dan koordinat.</p>',
    { onClose: function () { if (gps) gps.stop(); } });
  var gbox = $('#gbox', m.el), send = $('#send', m.el);
  function gate() {
    var g = st.last;
    var okGps = g && g.accuracy <= maks;
    send.disabled = !(okGps && st.canvas);
  }
  gps = watchGps(function (g) {
    st.last = g;
    var ok = g.accuracy <= maks;
    gbox.className = 'gps ' + (ok ? 'ok' : 'wait');
    gbox.innerHTML = (ok ? '✅ ' : '⏳ ') + 'Lokasi: ' + g.lat.toFixed(5) + ', ' + g.lng.toFixed(5) + ' · akurasi ±' + Math.round(g.accuracy) + ' m' + (ok ? '' : ' (menunggu ≤ ' + maks + ' m)');
    gate();
  }, function (msg) { gbox.className = 'gps bad'; gbox.textContent = '⚠️ ' + msg; });
  $('#slot', m.el).onclick = function () { $('#fi', m.el).click(); };
  $('#fi', m.el).onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    st.ts = f.lastModified || 0;
    readImage(f, 1024).then(function (c) {
      st.canvas = c;
      $('#slot', m.el).innerHTML = '<img src="' + c.toDataURL('image/jpeg', 0.6) + '">';
      gate();
    }).catch(onErr);
  };
  send.onclick = function () {
    var g = st.last;
    if (!g || !st.canvas) return;
    var data = stamp(st.canvas, [S.user.nama + ' · ' + (aksi === 'MASUK' ? 'MASUK' : 'PULANG'), stampTime(), g.lat.toFixed(6) + ', ' + g.lng.toFixed(6) + ' (±' + Math.round(g.accuracy) + ' m)']);
    busy(function () {
      return sendOrQueue('apiPresensi', { aksi: aksi, lat: g.lat, lng: g.lng, akurasi: g.accuracy, foto: data, foto_ts: st.ts, tsKlien: srvDate().getTime() });
    }, 'Mengirim presensi…').then(function (x) {
      gps.stop(); m.close();
      if (x.done) { S.presensi = x.r.presensi; S.off = x.r.serverMs - Date.now(); toast('Presensi berhasil dicatat.', 'ok'); } else toast(QMSG, 'ok');
      tHome();
    }).catch(onErr);
  };
}

/* ---------- PDF sederhana (tanpa pustaka luar): tabel teks A4 portrait, font Helvetica ---------- */
var _pdfCtx = null;

    if (c === 0x2013) c = 0x96; else if (c === 0x2014) c = 0x97; else if (c === 0x2022) c = 0x95;
    else if (c === 0x2018 || c === 0x2019) c = 0x27; else if (c === 0x201C || c === 0x201D) c = 0x22;

}

    var hh = 18;
    ops.push('0.9 g ' + f2(M) + ' ' + f2(y - hh) + ' ' + f2(TW) + ' ' + hh + ' re f 0 g');
    o.headers.forEach(function (h, i) {
      ops.push('0.5 w ' + f2(xs[i]) + ' ' + f2(y - hh) + ' ' + f2(o.widths[i]) + ' ' + hh + ' re S');

  }

  ops.push('1.2 w ' + f2(M) + ' ' + f2(y - 3) + ' m ' + f2(PW - M) + ' ' + f2(y - 3) + ' l S'); y -= 14;
  o.info.forEach(function (ln) { txt(M, y - 8, ln[0], 9, true); txt(M + 62, y - 8, ': ' + ln[1], 9, false); y -= 12; });

    var c = pg.join('\n');

  for (var k = 1; k < n; k++) out += ('0000000000' + offs[k]).slice(-10) + ' 00000 n \n';

    '<div class="t2-month"><span>Periode</span><input type="date" id="df" value="' + from0 + '" max="' + today + '"><b>s/d</b><input type="date" id="dt" value="' + today + '" max="' + today + '"></div>' +

    var ms = [], y = +f.substr(0, 4), mo = +f.substr(5, 2), end = t.substr(0, 7);
    for (;;) { var k = y + '-' + (mo < 10 ? '0' : '') + mo; ms.push(k); if (k >= end || ms.length > 24) break; mo++; if (mo > 12) { mo = 1; y++; } }

    });
    pr = pr.filter(function (r) { return r.tanggal >= s.f && r.tanggal <= s.t; }).sort(function (a, b) { return a.tanggal < b.tanggal ? 1 : (a.tanggal > b.tanggal ? -1 : 0); });

    } else {

    var list = tab === 'pres' ? c.pr : c.lp;

}

var ALIAS = { nik: 'no_nik', hp: 'no_hp', jk: 'jns_kelamin', jenis_kelamin: 'jns_kelamin', pendidikan: 'pddk', tempat_lahir: 'tpt_lhr', tanggal_lahir: 'tgl_lhr', kelurahan: 'kelurahan_desa', desa: 'kelurahan_desa', id: 'no_id', no_hp_wa: 'no_hp' };
function splitLine(l, d) {
  var out = [], cur = '', q = false;
  for (var i = 0; i < l.length; i++) {
    var ch = l[i];
    if (q) { if (ch === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function parseTable(text) {
  var lines = text.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim(); });
  if (lines.length < 2) return [];
  var d = lines[0].indexOf('\t') >= 0 ? '\t' : (lines[0].split(';').length > lines[0].split(',').length ? ';' : ',');
  var head = splitLine(lines[0], d).map(function (h) { h = h.trim().toLowerCase().replace(/\s+/g, '_'); return ALIAS[h] || h; });
  return lines.slice(1).map(function (l) {
    var c = splitLine(l, d), o = {};
    head.forEach(function (h, i) { o[h] = (c[i] || '').trim(); });
    return o;
  });
}

// ambil koordinat dari tautan Google Maps / teks "lat, lng"
function parseLatLng(t) {
  t = decodeURIComponent(String(t || '')).trim();
  var m = /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/.exec(t) || /@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(t) ||
    /[?&](?:q|ll|query|center)=(-?\d+(?:\.\d+)?)[,+ ]+(-?\d+(?:\.\d+)?)/.exec(t) || /^(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)$/.exec(t);
  if (!m) return null;
  var la = parseFloat(m[1]), lo = parseFloat(m[2]);
  if (isNaN(la) || isNaN(lo) || Math.abs(la) > 90 || Math.abs(lo) > 180) return null;
  return { lat: la.toFixed(6), lng: lo.toFixed(6) };
}

        var i = +inp.getAttribute('data-paste');
        inp.onpaste = function () { setTimeout(function () { fill(i, inp.value); }, 0); };
        inp.onchange = function () { if (inp.value.trim()) fill(i, inp.value); };
      });
      $$('#lok [data-clip]').forEach(function (b) {
        b.onclick = function () {
          var i = +b.getAttribute('data-clip');
          try { navigator.clipboard.readText().then(function (t) { fill(i, t); }, function () { toast('Tidak bisa membaca clipboard. Tempel manual di kolom.', 'err'); }); } catch (e) { toast('Tidak bisa membaca clipboard. Tempel manual di kolom.', 'err'); }
        };
      });
      $$('#lok [data-x]').forEach(function (b) { b.onclick = function () { lok.splice(+b.getAttribute('data-x'), 1); drawLok(); }; });
    }
    drawLok();
    $('#la').onclick = function () { lok.push({ nama: '', lat: '', lng: '', radius_m: 100 }); drawLok(); };
    $('#lg').onclick = function () {
      if (!navigator.geolocation) { toast('Browser tidak mendukung GPS.', 'err'); return; }
      loading(true, 'Mencari lokasi…');
      navigator.geolocation.getCurrentPosition(function (p) { loading(false); lok.push({ nama: 'Lokasi baru', lat: p.coords.latitude.toFixed(6), lng: p.coords.longitude.toFixed(6), radius_m: 100 }); drawLok(); },
        function () { loading(false); toast('Lokasi tidak dapat diambil. Isi koordinat secara manual.', 'err'); }, { enableHighAccuracy: true, timeout: 20000 });
    };
    $('#ls').onclick = function () { busy(function () { return api('apiLokasiSimpan', lok); }).then(function () { toast('Lokasi tersimpan.', 'ok'); return api('apiBootstrap'); }).then(function (b) { S.cfg = b.cfg; }).catch(onErr); };

    var jad = (d.jadwal || []).map(function (x) { return Object.assign({}, x); });
    var saved = (d.jadwal || []).map(function (x) { return Object.assign({}, x); });
    var lokNames = (d.lokasi || []).map(function (l) { return l.nama; }).filter(String);
    function drawJsum() {
      $('#jsum').innerHTML = saved.length ? tbl(['Jadwal tersimpan', 'Kategori', 'Bidang', 'Jam (' + wz + ')', 'Hari kerja'], saved.map(function (x) {
        return '<tr><td><b>' + esc(x.nama) + '</b></td><td>' + esc(x.kategori || 'Semua') + '</td><td>' + esc(x.bidang || 'Semua') + '</td><td style="white-space:nowrap">' + esc((x.jam_masuk || s.jam_masuk) + ' – ' + (x.jam_pulang || s.jam_pulang)) + (x.lintas_hari === 'YA' ? ' (lintas hari)' : '') + '</td><td>' + esc(x.hari_kerja ? hkTxt(x.hari_kerja) : 'Ikut pengaturan') + '</td></tr>';
      })) : '<small class="muted">Belum ada jadwal khusus tersimpan — semua tenaga memakai pengaturan umum.</small>';
    }
    drawJsum();
    function drawJad() {
      $('#jad').innerHTML = jad.length ? jad.map(function (x, i) {
        var hkj = String(x.hari_kerja || '').split(',');
        var lkj = String(x.lokasi || '').split(';');
        var at = ' data-i="' + i + '"';
        return '<div class="card" style="background:#f7faf8"><div class="grid">' +
          frow('Nama jadwal', '<input data-k="nama"' + at + ' value="' + esc(x.nama) + '">') +
          frow('Kategori (kosong = semua)', '<select data-k="kategori"' + at + '>' + optsHtml(kats, x.kategori, '— semua —') + '</select>') +
          frow('Bidang (kosong = semua)', '<select data-k="bidang"' + at + '>' + optsHtml(bids, x.bidang, '— semua —') + '</select>') +
          frow('Jam masuk (' + wz + ')', '<input type="time" data-k="jam_masuk"' + at + ' value="' + esc(x.jam_masuk) + '">') +
          frow('Jam pulang paling awal (' + wz + ')', '<input type="time" data-k="jam_pulang"' + at + ' value="' + esc(x.jam_pulang) + '">') +
          frow('Toleransi terlambat (menit)', '<input type="number" min="0" data-k="toleransi_menit"' + at + ' value="' + esc(x.toleransi_menit) + '">') +
          frow('Lintas hari (pulang melewati tengah malam)', '<select data-k="lintas_hari"' + at + '><option value="">TIDAK</option><option value="YA"' + (x.lintas_hari === 'YA' ? ' selected' : '') + '>YA</option></select>') +
          '<div class="full"><label>Lokasi kerja yang berlaku (kosongkan semua = semua lokasi)</label><div class="row">' + (lokNames.length ? lokNames.map(function (ln) { return '<label style="margin:0;font-weight:500"><input type="checkbox" class="jlk"' + at + ' value="' + esc(ln) + '"' + (lkj.indexOf(ln) >= 0 ? ' checked' : '') + '> ' + esc(ln) + '</label>'; }).join('') : '<small class="muted">Belum ada lokasi kerja tersimpan.</small>') + '</div></div>' +
          frow('Wajib berada dalam radius lokasi', '<select data-k="wajib_radius"' + at + '><option value="">Ikut pengaturan umum</option><option value="YA"' + (x.wajib_radius === 'YA' ? ' selected' : '') + '>YA (tolak di luar radius)</option><option value="TIDAK"' + (x.wajib_radius === 'TIDAK' ? ' selected' : '') + '>TIDAK (hanya tandai ⚠️)</option></select>') +
          '<div class="full">' + frow('Hari libur khusus jadwal ini (yyyy-mm-dd, pisahkan koma; ditambahkan ke libur umum)', '<textarea data-k="hari_libur"' + at + ' style="min-height:50px">' + esc(x.hari_libur) + '</textarea>') + '</div>' +
          '<div class="full"><label>Hari kerja (kosongkan semua = ikut pengaturan umum)</label><div class="row">' + days.map(function (dd) { return '<label style="margin:0;font-weight:500"><input type="checkbox" class="jhk"' + at + ' value="' + dd[0] + '"' + (hkj.indexOf(dd[0]) >= 0 ? ' checked' : '') + '> ' + dd[1] + '</label>'; }).join('') + '</div></div>' +
          '</div><button class="btn btn-sm btn-danger" data-jx="' + i + '">Hapus jadwal</button></div>';
      }).join('') : '';
      $$('#jad [data-k]').forEach(function (inp) { inp.oninput = inp.onchange = function () { jad[+inp.getAttribute('data-i')][inp.getAttribute('data-k')] = inp.value; }; });
      $$('#jad .jlk').forEach(function (cb) { cb.onchange = function () { var i = +cb.getAttribute('data-i'); jad[i].lokasi = $$('#jad .jlk[data-i="' + i + '"]:checked').map(function (c) { return c.value; }).join(';'); }; });
      $$('#jad .jhk').forEach(function (cb) { cb.onchange = function () { var i = +cb.getAttribute('data-i'); jad[i].hari_kerja = $$('#jad .jhk[data-i="' + i + '"]:checked').map(function (c) { return c.value; }).join(','); }; });
      $$('#jad [data-jx]').forEach(function (b) { b.onclick = function () { jad.splice(+b.getAttribute('data-jx'), 1); drawJad(); }; });
    }
    drawJad();
    $('#ja').onclick = function () { jad.push({ nama: '', kategori: '', bidang: '', jam_masuk: '', jam_pulang: '', toleransi_menit: '', hari_kerja: '', lintas_hari: '', lokasi: '', wajib_radius: '', hari_libur: '' }); drawJad(); };
    $('#js').onclick = function () { busy(function () { return api('apiJadwalSimpan', jad); }).then(function () { saved = jad.map(function (x) { return Object.assign({}, x); }); drawJsum(); toast('Jadwal tersimpan.', 'ok'); }).catch(onErr); };

    $('#adm').innerHTML = '<small class="muted">SUPER: semua fitur. VERIFIKATOR: melihat data dan mengoreksi presensi. VIEWER: hanya melihat dan mengekspor. Perubahan peran berlaku pada tindakan berikutnya.</small>' + tbl(['Username', 'Nama', 'Peran', 'Status', ''], d.admins.map(function (a) {
      return '<tr><td>' + esc(a.username) + '</td><td>' + esc(a.nama) + '</td><td>' + esc(a.peran) + '</td><td>' + esc(a.status) + '</td><td><button class="btn btn-sm" data-ea="' + esc(a.username) + '">Ubah</button></td></tr>';
    }));
    $$('#adm [data-ea]').forEach(function (b) { b.onclick = function () { adminForm(d.admins.filter(function (a) { return a.username === b.getAttribute('data-ea'); })[0]); }; });
    $('#aa').onclick = function () { adminForm(null); };
    $('#ap').onclick = pwForm;
  }).catch(onErr);
}

function pwForm() {
  var m = openModal('Ganti password saya', '<form id="gp"><label>Password lama</label><input name="a" type="password" required><label>Password baru (min. 8 karakter)</label><input name="b" type="password" required><label>Ulangi password baru</label><input name="c" type="password" required><button class="btn btn-primary btn-block mt">Simpan</button></form>');
  $('#gp', m.el).onsubmit = function (e) {
    e.preventDefault(); var v = formVals(m.el);
    if (v.b !== v.c) { toast('Konfirmasi tidak sama.', 'err'); return; }
    busy(function () { return api('apiGantiPassword', v.a, v.b); }).then(function () { m.close(); toast('Password diganti.', 'ok'); }).catch(onErr);
  };
}

function adminForm(a) {
  var baru = !a; a = a || { status: 'Aktif', peran: 'VIEWER' };
  var m = openModal(baru ? 'Tambah admin' : 'Ubah admin',
    '<form id="af"><label>Username</label><input name="username" value="' + esc(a.username) + '"' + (baru ? '' : ' readonly') + ' required><label>Nama</label><input name="nama" value="' + esc(a.nama) + '" required>' +
    '<label>' + (baru ? 'Password (min. 8 karakter)' : 'Password baru (kosongkan bila tidak diubah)') + '</label><input name="password" type="password"' + (baru ? ' required' : '') + '>' +
    '<label>Peran</label><select name="peran">' + ['SUPER', 'VERIFIKATOR', 'VIEWER'].map(function (x) { return '<option' + (a.peran === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
    '<label>Status</label><select name="status"><option' + (a.status === 'Aktif' ? ' selected' : '') + '>Aktif</option><option' + (a.status === 'Nonaktif' ? ' selected' : '') + '>Nonaktif</option></select>' +
    '<button class="btn btn-primary btn-block mt">Simpan</button></form>');
  $('#af', m.el).onsubmit = function (e) {
    e.preventDefault();
    busy(function () { return api('apiAdminSimpan', formVals(m.el)); }).then(function () { m.close(); toast('Tersimpan.', 'ok'); aSetting(); }).catch(onErr);
  };
}

/* ============================================================
 * Mulai
 * ========================================================== */
/* Pengaman lebar: bila area tampilan lebih lebar dari layar HP (terjadi pada sebagian iOS/Safari
 * di dalam iframe Apps Script), kunci lebar halaman sebesar lebar layar fisik agar tidak terpotong. */
function fitW() {
  try {
    var de = document.documentElement, sw = Math.min(screen.width || 9999, screen.height || 9999);
    var iw = de.clientWidth || innerWidth;
    var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    var W = (touch && sw <= 600 && iw > sw + 2 && innerHeight >= iw * 0.9) ? sw : 0;
    de.style.setProperty('--vw', W ? W + 'px' : '100%');
    de.classList.toggle('vwfix', !!W);
  } catch (e) {}
}
fitW(); addEventListener('resize', fitW); addEventListener('orientationchange', function () { setTimeout(fitW, 350); });

// Simpan aplikasi di perangkat (hanya di GitHub Pages): pembukaan berikutnya instan, versi baru dimuat di latar belakang
try { if ('serviceWorker' in navigator && /\.github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* abaikan */ }
var saved = store('eo_token');
if (saved) { S.token = saved; boot(); } else renderLogin();

})();
</script>
