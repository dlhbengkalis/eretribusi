<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>E-Retribusi DLH Kab. Bengkalis</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; background: #f1f5f2; font-family: system-ui, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #fallback {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: none; padding: 10px 14px; background: #fff8e1;
    border-top: 1px solid #e0c97a; font-size: 14px; text-align: center;
  }
  #fallback a { font-weight: 600; }
</style>
</head>
<body>

<iframe id="app" title="E-Retribusi" allow="geolocation *; camera *; clipboard-write *" referrerpolicy="no-referrer"></iframe>

<div id="fallback">
  Aplikasi tidak tampil? Buka langsung:
  <a id="tautan" target="_top" href="#">E-Retribusi</a>
</div>

<script>
  // GANTI alamat berikut dengan URL web app E-Retribusi Anda
  // (Apps Script: Deploy > Manage deployments > Web app > Copy, berakhiran /exec).
  var URL_APLIKASI = 'https://script.google.com/macros/s/AKfycbxt8lj79nrbqjrN4TXbPG8m9-yYqmpUgCe5AKbJKfJlUL57iAnSB0AM5geLf5iLeqRp/exec';

  var f = document.getElementById('app'), loaded = false;
  document.getElementById('tautan').href = URL_APLIKASI;
  f.addEventListener('load', function () { loaded = true; });
  f.src = URL_APLIKASI;
  // Tampilkan tautan cadangan jika iframe belum termuat dalam 12 detik.
  setTimeout(function () { if (!loaded) document.getElementById('fallback').style.display = 'block'; }, 12000);
</script>
</body>
</html>
